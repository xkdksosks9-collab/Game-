
name: Build Grand RP Name Watcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir -p android-project
          unzip -q GrandRPNameWatcher-AndroidStudio-Project-v2.zip -d android-project
          cp -a android-project/. .

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrandRP-Name-Watcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
